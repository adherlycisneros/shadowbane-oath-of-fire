<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shadowbane: Oath of Fire</title>
    <meta name="description" content="A dark-fantasy dungeon adventure. Guide Darklord and Chxospixie through six rooms of puzzles, combat, curses, and a final reckoning." />

    <!-- Social sharing (og:url and og:image wait for the production domain) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shadowbane: Oath of Fire" />
    <meta property="og:title" content="Shadowbane: Oath of Fire" />
    <meta property="og:description" content="A dark-fantasy dungeon adventure. Guide Darklord and Chxospixie through six rooms of puzzles, combat, curses, and a final reckoning." />

    <!-- The title painting starts downloading alongside the app bundle instead of after first render -->
    <link rel="preload" as="image" href="/assets/backgrounds/title-bg.webp" />

    <!-- PWA essentials (the manifest link is injected by vite-plugin-pwa) -->
    <meta name="theme-color" content="#1a0f0f" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shadowbane" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
